<!doctype html><html><head><meta charset="utf-8"><title>Login Selenium Demo</title><style>body{font-family:Arial;max-width:420px;margin:40px auto}input,button{display:block;padding:10px;margin:10px 0;width:100%;box-sizing:border-box}#message{font-weight:bold}</style></head><body><h1>Login test page</h1><form id="login"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><p id="message" role="status"></p><script>document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('username').value,p=document.getElementById('password').value;document.getElementById('message').textContent=(u==='admin'&&p==='12345')?'Login successful':'Invalid credentials';});</script></body></html>
