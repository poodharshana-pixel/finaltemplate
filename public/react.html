<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>React Appointment Demo</title><link rel="stylesheet" href="style.css"><script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script></head>
<body><main class="container"><h1>ReactJS Salon Appointment Demo</h1><p>This standalone learning demo uses React components, state, props, events, and list rendering. It does not save to MongoDB.</p><div id="root"></div><p><a href="/">Open the AngularJS + MongoDB application</a></p></main>
<script type="text/babel">
const {useState}=React;
function AppointmentForm({onAdd}) { const [form,setForm]=useState({name:'',gender:'Female',service:'Haircut'}); function change(e){setForm({...form,[e.target.name]:e.target.value});} function submit(e){e.preventDefault(); if(!form.name.trim()) return; onAdd({...form,id:Date.now()}); setForm({...form,name:''});} return <form className="card" onSubmit={submit}><h2>Book a demo appointment</h2><label>Customer name<input name="name" value={form.name} onChange={change} required /></label><label>Gender<select name="gender" value={form.gender} onChange={change}><option>Female</option><option>Male</option><option>Other</option></select></label><label>Service<select name="service" value={form.service} onChange={change}><option>Haircut</option><option>Hair Spa</option><option>Facial</option><option>Manicure</option><option>Pedicure</option><option>Makeup</option></select></label><button type="submit">Add appointment</button></form> }
function AppointmentList({items,onDelete}) { return <section className="card"><h2>Appointments ({items.length})</h2>{items.length===0?<p>No appointments yet.</p>:<ul>{items.map(a=><li key={a.id}>{a.name} — {a.gender} — {a.service} <button onClick={()=>onDelete(a.id)}>Remove</button></li>)}</ul>}</section> }
function App(){const [items,setItems]=useState([]);return <><AppointmentForm onAdd={a=>setItems([...items,a])}/><AppointmentList items={items} onDelete={id=>setItems(items.filter(a=>a.id!==id))}/></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
